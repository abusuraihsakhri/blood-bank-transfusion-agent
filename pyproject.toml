[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blood-bank-transfusion-agent"
version = "2.1.0"
description = "Transfusion-medicine compatibility, ratio, cold-chain, and reaction-triage reference tools"
readme = "README.md"
authors = [{ name = "Abu Suraih Sakhri" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
blood-bank-transfusion-agent = "blood_bank_transfusion_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/blood-bank-transfusion-agent"
Repository = "https://github.com/abusuraihsakhri/blood-bank-transfusion-agent.git"

[tool.setuptools]
py-modules = [
    "blood_bank_transfusion",
    "cli",
    "crossmatch_engine",
    "inventory_manager",
    "mtp_ratio_coldchain",
    "transfusion_guard",
    "transfusion_safety",
]
packages = ["blood_bank_transfusion_agent"]
