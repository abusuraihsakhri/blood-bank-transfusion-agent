name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          python -m pip install -e . pytest pip-audit

      - name: Run tests
        run: python -m pytest -q

      - name: Python syntax check
        run: python -m compileall -q .

      - name: JavaScript syntax check
        run: node --check app.js

      - name: Dependency audit
        run: python -m pip_audit

      - name: CLI batch smoke test
        run: |
          python cli.py batch -i sample.csv -o out_ci.csv
          python - <<'PY'
          import csv
          with open("out_ci.csv", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) >= 15, f"Expected at least 15 rows, got {len(rows)}"
          print(f"Batch smoke test passed with {len(rows)} rows")
          PY
          rm -f out_ci.csv
